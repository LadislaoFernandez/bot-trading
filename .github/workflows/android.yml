# Compila la app de control para Android (APK). Se lanza a mano o desde "Publicar versión".
name: App Android

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Si se indica (por ejemplo v1.11), adjunta el APK a esa Release"
        required: false
        default: ""
  workflow_call:
    inputs:
      etiqueta:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependencias de compilación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev >/dev/null
          pip install -q "buildozer==1.5.0" "cython==0.29.36" pillow
      - name: Probar la app en Linux contra un servidor de prueba
        run: |
          sudo apt-get install -y -qq xvfb libgl1 libmtdev1 >/dev/null
          pip install -q "kivy==2.3.0" "cryptography>=42"
          xvfb-run -a python tests/prueba_android.py
      - name: Preparar la app (cliente de la API, textos de avisos, Firebase, ícono y versión)
        run: |
          cp cliente_api.py avisos.py android/
          if [ ! -f android/google-services.json ]; then
            echo "::error::Falta android/google-services.json (configuración del proyecto de Firebase)."; exit 1
          fi
          python - <<'PY'
          # lo mismo que haría el plugin google-services: la configuración de Firebase como recursos de Android
          import json, os
          g = json.load(open("android/google-services.json", encoding="utf-8"))
          c = next(c for c in g["client"]
                   if c["client_info"]["android_client_info"]["package_name"] == "io.github.ladislaofernandez.botcontrol")
          v = {"google_app_id": c["client_info"]["mobilesdk_app_id"],
               "gcm_defaultSenderId": g["project_info"]["project_number"],
               "google_api_key": c["api_key"][0]["current_key"],
               "google_crash_reporting_api_key": c["api_key"][0]["current_key"],
               "project_id": g["project_info"]["project_id"],
               "google_storage_bucket": g["project_info"].get("storage_bucket", "")}
          os.makedirs("android/res_firebase/values", exist_ok=True)
          with open("android/res_firebase/values/firebase.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
              for k, x in v.items():
                  f.write(f'    <string name="{k}" translatable="false">{x}</string>\n')
              f.write("</resources>\n")
          print("Firebase:", v["project_id"])
          PY
          python - <<'PY'
          from PIL import Image
          Image.open("app_icon.ico").convert("RGBA").resize((512, 512)).save("android/icono.png")
          import re
          v = re.search(r'^VERSION = "([^"]+)"', open("config.py", encoding="utf-8").read(), re.M).group(1)
          s = open("android/buildozer.spec", encoding="utf-8").read().replace("version = 1.0", f"version = {v}")
          open("android/buildozer.spec", "w", encoding="utf-8").write(s)
          print("versión", v)
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
      - name: Llave fija para firmar el APK
        # Android solo deja actualizar la app si la versión nueva viene firmada con la misma llave. La llave está en
        # el secreto ANDROID_DEBUG_KEYSTORE (archivo en base64); sin ella, cada compilación tendría una llave distinta.
        env:
          LLAVE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::error::Falta el secreto ANDROID_DEBUG_KEYSTORE: el APK no se podría instalar encima del anterior."
            exit 1
          fi
          echo "$LLAVE" | base64 -d > "$RUNNER_TEMP/firma.keystore"
          keytool -list -keystore "$RUNNER_TEMP/firma.keystore" -storepass android >/dev/null
      - name: Compilar el APK (versión release, firmada con la llave fija)
        working-directory: android
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/firma.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: android
          P4A_RELEASE_KEYALIAS: androiddebugkey
          P4A_RELEASE_KEYALIAS_PASSWD: android
        run: |
          rm -rf bin
          yes | buildozer android release
      - name: Revisar que el APK trae Firebase (avisos push)
        run: |
          m=$(find android/.buildozer -path "*dists*" -name AndroidManifest.xml | head -1)
          echo "$m"
          grep -q "POST_NOTIFICATIONS" "$m" && grep -q "default_notification_channel_id" "$m"
          grep -o 'targetSdkVersion="[0-9]*"' "$m" || true
          signer=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/ | tail -1)
          "$signer/aapt" dump xmltree android/bin/*release*.apk AndroidManifest.xml | grep -q "com.google.firebase.messaging.FirebaseMessagingService"
          "$signer/aapt" dump resources android/bin/*release*.apk | grep -q "string/google_app_id"
          unzip -l android/bin/*release*.apk | grep -c "dex" 
      - name: Revisar la firma del APK
        run: |
          signer=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | tail -1)
          a=$("$signer" verify --print-certs android/bin/*release*.apk | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          b=$(keytool -list -v -keystore "$RUNNER_TEMP/firma.keystore" -storepass android | grep -i "SHA256:" | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK: $a"; echo "llave: $b"
          [ -n "$a" ] && [ "$a" = "$b" ]
      - name: Nombre final
        run: |
          mkdir -p dist
          cp android/bin/*release*.apk dist/BotTrading-Control.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/BotTrading-Control.apk
      - name: Adjuntar a la Release
        if: inputs.etiqueta != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.etiqueta }}" dist/BotTrading-Control.apk --clobber -R "${{ github.repository }}"
