# Publica una versión nueva. Se lanza subiendo una etiqueta vX.Y (igual a VERSION en config.py) o a mano desde
# Actions → "Publicar versión" → Run workflow con "publicar" tildado. Arma
#   - actualizacion.zip            (lo baja la app para actualizarse sola)
#   - BotTrading-Setup-X.Y.exe     (instalador completo, con Python incluido)
# y los adjunta a una Release de GitHub.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la versión (si no, solo arma el instalador de prueba)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar todo
        run: python -m compileall -q .
      - name: Pruebas del bot
        run: python tests/correr_pruebas.py
      - name: Prueba de interfaz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 >/dev/null
          pip install -q "PySide6-Essentials>=6.7"
          python tests/prueba_rueda.py
          pip install -q "cryptography>=42"
          python tests/prueba_control.py

  servidor:
    # instala el servidor desde cero en una máquina Ubuntu limpia, igual que en Oracle Cloud, y prueba la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el paquete
        run: python3 installer/armar_zip.py
      - name: Instalar el servidor con el instalador
        run: ZIP_LOCAL="$PWD/dist/actualizacion.zip" IP=127.0.0.1 bash instalar_servidor.sh
      - name: Probar el servicio y la API con el cliente de las apps
        run: |
          sleep 15
          systemctl is-active bot-trading
          CODIGO=$(~/bot-trading/venv/bin/python ~/bot-trading/servidor.py codigo)
          python3 - "$CODIGO" <<'PY'
          import sys, time
          import cliente_api as C
          cl = C.Cliente(sys.argv[1])
          e = None
          for _ in range(10):
              try:
                  e = cl.estado(); break
              except C.ErrorConexion as x:
                  print("todavía no:", x); time.sleep(3)
          assert e, "no se pudo conectar"
          print("servidor", e["version"], e["modo"], "piloto", e["snap"]["auto"])
          assert e["servidor"] and e["modo"] == "simulado"
          assert cl.accion("laboratorio", activo=False) == "ok"
          print("API OK")
          PY
      - name: Registro del servidor (si algo falló)
        if: failure()
        run: sudo journalctl -u bot-trading --no-pager | tail -50; tail -30 ~/bot-trading/*.log || true

  publicar:
    needs: [pruebas, servidor]
    runs-on: windows-latest
    outputs:
      v: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Armar archivos de la app
        run: python installer/armar_zip.py
      - name: Controlar que la etiqueta coincida con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = Get-Content build/version.txt
          if ("v$v" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con VERSION = $v en config.py" }
      - name: Preparar Python con las dependencias
        shell: pwsh
        run: ./installer/preparar_python.ps1
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar el instalador
        shell: pwsh
        run: |
          $v = Get-Content build/version.txt
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" installer\bot_trading.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }
      - name: Probar que la app arranca con el Python del instalador
        shell: pwsh
        run: |
          Copy-Item -Recurse build/python build/app/python
          & build/app/python/python.exe -c "import sys; sys.argv=['app.py']; import config, i18n, engine, paper_trader, live, mercado, auto, actualizador, claves, app_data, reglas, catalogo, alertas, laboratorio, archivos; print('modulos OK', config.VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "la app no importa con el Python del instalador" }
      - uses: actions/upload-artifact@v4
        with:
          name: publicacion
          path: dist/*
      - name: Leer la versión
        id: ver
        shell: pwsh
        run: echo "v=$(Get-Content build/version.txt)" >> $env:GITHUB_OUTPUT
      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Versión ${{ steps.ver.outputs.v }}
          body_path: build/notas.md
          files: |
            dist/actualizacion.zip
            dist/BotTrading-Setup-*.exe

  android:
    # la app de control para Android, adjunta a la misma versión
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/') || inputs.publicar
    uses: ./.github/workflows/android.yml
    with:
      etiqueta: v${{ needs.publicar.outputs.v }}
    secrets: inherit  # la llave fija con la que se firma el APK
