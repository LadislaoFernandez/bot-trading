# Publica una versión nueva. Se lanza subiendo una etiqueta vX.Y (igual a VERSION en config.py) o a mano desde
# Actions → "Publicar versión" → Run workflow con "publicar" tildado. Arma
#   - actualizacion.zip            (lo baja la app para actualizarse sola)
#   - BotTrading-Setup-X.Y.exe     (instalador completo, con Python incluido)
# y los adjunta a una Release de GitHub.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la versión (si no, solo arma el instalador de prueba)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar todo
        run: python -m compileall -q .
      - name: Pruebas del bot
        run: python tests/correr_pruebas.py

  publicar:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Armar archivos de la app
        run: python installer/armar_zip.py
      - name: Controlar que la etiqueta coincida con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = Get-Content build/version.txt
          if ("v$v" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con VERSION = $v en config.py" }
      - name: Preparar Python con las dependencias
        shell: pwsh
        run: ./installer/preparar_python.ps1
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar el instalador
        shell: pwsh
        run: |
          $v = Get-Content build/version.txt
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" installer\bot_trading.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }
      - name: Probar que la app arranca con el Python del instalador
        shell: pwsh
        run: |
          Copy-Item -Recurse build/python build/app/python
          & build/app/python/python.exe -c "import sys; sys.argv=['app.py']; import config, i18n, engine, paper_trader, live, mercado, auto, actualizador, claves, app_data; print('modulos OK', config.VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "la app no importa con el Python del instalador" }
      - uses: actions/upload-artifact@v4
        with:
          name: publicacion
          path: dist/*
      - name: Leer la versión
        id: ver
        shell: pwsh
        run: echo "v=$(Get-Content build/version.txt)" >> $env:GITHUB_OUTPUT
      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Versión ${{ steps.ver.outputs.v }}
          body_path: build/notas.md
          files: |
            dist/actualizacion.zip
            dist/BotTrading-Setup-*.exe
